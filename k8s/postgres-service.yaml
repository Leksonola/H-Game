apiVersion: v1
kind: Service

metadata:
  name: postgres-service
  namespace: h-game
  labels:
    app: postgres

spec:
  # ============================================
  # HEADLESS SERVICE
  # ============================================
  type: ClusterIP
  clusterIP: None # Headless service

  # Headless = No load balancing, direct Pod access
  # Regular: postgres-service → random Pod
  # Headless: postgres-0.postgres-service → specific Pod
  # postgres-service → all Pod IPs

  # Why headless for StatefulSet?
  # - Direct Pod addressing (postgres-0.postgres-service)
  # - Database replication needs stable Pod identity
  # - Primary/replica distinction requires direct access

  selector:
    app: postgres # Route to Pods with app=postgres

  ports:
    - name: postgres
      protocol: TCP
      port: 5432 # PostgreSQL default port
      targetPort: 5432 # Pod port (same as containerPort)