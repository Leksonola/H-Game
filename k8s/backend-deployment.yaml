apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: h-game
  labels:
    app: backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        version: v3 # Changed from v2 to v3 (we added Redis)

    spec:
      containers:
        - name: backend
          image: leksonola/humor-game-backend:v1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001
              name: http

          env:
            # Basic settings
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "3001"

            # Database connection
            - name: DB_HOST
              value: "postgres-service"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-db

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password

            # ============================================
            # REDIS CONNECTION
            # ============================================
            - name: REDIS_HOST
              value: "redis-service"

            - name: REDIS_PORT
              value: "6379"

          # ============================================
          # RESOURCE MANAGEMENT
          # ============================================
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          # ============================================
          # LIVENESS PROBE
          # ============================================
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10

          # ============================================
          # READINESS PROBE
          # ============================================
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5