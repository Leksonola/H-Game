
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: humorgame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: humorgame
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/combined-init.sql:/docker-entrypoint-initdb.d/combined-init.sql:ro
    networks:
      - humor-game-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humorgame"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    ports:
      - "5432:5432"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - humor-game-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: humor-game-backend:v1
    container_name: backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://humorgame:${POSTGRES_PASSWORD}@postgresxxx:5432/humorgame
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: humorgame
      DB_PASSWORD: devops123
      DB_NAME: humorgame
    networks:
      - humor-game-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    ports:
      - "3001:3001"

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: humor-game-frontend:v1
    container_name: frontend
    networks:
      - humor-game-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
      - "80:80"          # Frontend accessible on port 80

# Networks
networks:
  humor-game-net:
    driver: bridge

# Volumes
volumes:
  postgres-data:
  redis-data: